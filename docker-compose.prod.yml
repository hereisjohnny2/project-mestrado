# Produção local: sem bind-mount do código, reinício automático e só o
# frontend exposto (o nginx dele faz proxy de /api para o backend).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python -m app.seed   # opcional
#
# Porta: ROCKSEG_PORT (padrão 8080). Dados: volume nomeado `storage`
# (SQLite + imagens + modelos).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - storage:/app/storage
    environment:
      - ROCKSEG_STORAGE_DIR=/app/storage
      - ROCKSEG_CORS_ORIGINS=["http://localhost:${ROCKSEG_PORT:-8080}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${ROCKSEG_PORT:-8080}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  storage:
