# Fase 0: sobe backend (FastAPI) + frontend (placeholder) para provar que a
# base está de pé. Plano §4.1 / §9 (deploy: docker compose local, CPU).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - storage:/app/storage
    environment:
      - ROCKSEG_STORAGE_DIR=/app/storage
      - ROCKSEG_CORS_ORIGINS=["http://localhost:5173"]
      # Override with a long random value for anything beyond local use.
      - ROCKSEG_SECRET_KEY=${ROCKSEG_SECRET_KEY:-dev-insecure-secret-change-me}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  storage:
