# Desenvolvimento: backend com o código montado por bind-mount + frontend.
# Para produção local, ver docker-compose.prod.yml.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - storage:/app/storage
    environment:
      - ROCKSEG_STORAGE_DIR=/app/storage
      - ROCKSEG_CORS_ORIGINS=["http://localhost:5173"]
      # Override with a long random value for anything beyond local use.
      - ROCKSEG_SECRET_KEY=${ROCKSEG_SECRET_KEY:-dev-insecure-secret-change-me}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  storage:
