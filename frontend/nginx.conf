server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Batches of large rock images are uploaded through /api; nginx's
    # default 1 MB body limit would reject them.
    client_max_body_size 1g;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Training/segmentation progress is streamed as SSE: buffering
        # would hold events back until the job ends.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
